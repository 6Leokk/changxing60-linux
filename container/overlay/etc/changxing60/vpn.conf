# changxing60-vpn settings (sourced by /opt/changxing60/bin/changxing60-vpn)
# Put your vless://... URI here (from your subscription / airport export) and set ENABLE=1.
# Test with:  changxing60-vpn gen && changxing60-vpn run   (foreground), then "status" for the exit IP.
ENABLE=0
VLESS_URI=

# 1 = drop all WAN traffic that is not sing-box's own (needs iptables; Android's is bind-mounted
# inside the chroot at /system/bin/iptables). Keeps you from leaking if the tunnel dies.
KILL_SWITCH=1
WAN_IFACES="rmnet_data0 rmnet_data1 rmnet_data2 wlan0"

# DNS the tunnel resolves through (and the one used to resolve the VPN server itself)
REMOTE_DNS=1.1.1.1
BOOTSTRAP_DNS=1.1.1.1

# subnets that must never go through the tunnel: the Android hotspot clients keep their
# direct path for local services (LuCI, dnsmasq). Android hotspots default to 192.168.43.0/24.
LAN_CIDRS=192.168.43.0/24,192.168.77.0/24

# the stock kernel has no nftables, so strict_route must stay 0
STRICT_ROUTE=0
IPV6=0
